<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Мессенджер</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1>Вход</h1>

        <form id="loginForm" method="POST" action="/login" novalidate>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" placeholder="Ваш логин">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Ваш пароль">
            </div>

            <div id="errorMessage" class="error-message">{{ error or '' }}</div>

            <button type="submit">Войти</button>
        </form>

        <p class="auth-switch">
            Нет аккаунта? <a href="{{ url_for('index') }}">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
